name: Buildah Build

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Buildah Action
        uses: redhat-actions/buildah-build@v3
        with:
          image: python
          tags: auto
          containerfiles: |
            ./Containerfile
          build-args: |
            some_arg=some_value

      - name: Push To quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@v3
        with:
          image: python
          tags: auto
          registry: quay.io/plebs_inc
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
